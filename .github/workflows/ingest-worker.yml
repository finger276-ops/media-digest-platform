name: Автозагрузка выгрузок

# Воркер разбирает очередь platform_ingest_queue: берет файлы, которые положил
# n8n, обрабатывает их штатным пайплайном платформы и создает периоды проектов.
#
# Запускается вручную (кнопка Run workflow) и по внешнему сигналу
# repository_dispatch — n8n дергает его сразу после загрузки файла.
#
# Расписание выключено, пока n8n не подключён: очередь пуста, а запуск каждые
# 15 минут заново ставит зависимости — около 2 900 минут Actions в месяц при
# бесплатных 2 000 у закрытого репозитория. Кончится лимит — встанет и ночная
# резервная копия (backup.yml). Когда n8n заработает, раскомментируйте
# schedule ниже, если нужна страховка на случай пропущенного сигнала.

on:
  # schedule:
  #   # Каждые 15 минут. GitHub может задерживать запуск в часы пиковой нагрузки.
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Сколько задач обработать за запуск"
        required: false
        default: "10"
  repository_dispatch:
    types: [ingest]

concurrency:
  # Два воркера одновременно не нужны: очередь и так защищена от гонок,
  # но параллельные запуски тратят лимиты Actions.
  group: ingest-worker
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Установить зависимости
        run: pip install -r requirements-worker.txt

      - name: Проверить секреты Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Секреты Streamlit Cloud сюда не попадают: у GitHub Actions свои.
        # Без этой проверки задача падала трейсбеком, а в сводке запуска
        # было только «Process completed with exit code 1».
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Не заданы секреты репозитория::Добавьте в GitHub → Settings → Secrets and variables → Actions:$missing (значения те же, что в секретах Streamlit Cloud). Подробно — docs/BACKUPS.md, раздел «Секреты GitHub»."
            exit 1
          fi

      - name: Обработать очередь
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          INGEST_NOTIFY_WEBHOOK: ${{ secrets.INGEST_NOTIFY_WEBHOOK }}
          INGEST_WORKER_ID: github-actions-${{ github.run_id }}
        run: |
          python scripts/ingest_worker.py \
            --max-tasks "${{ github.event.inputs.max_tasks || '10' }}" \
            --verbose
